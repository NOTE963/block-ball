<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>コアブレイカー - CORE BREAKER</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#141924;
    --panel2:#1c2333;
    --accent:#5ee1c9;
    --accent2:#ff5d7a;
    --text:#e9edf5;
    --sub:#8b94a8;
    --brick-p1:#5ee1c9;
    --brick-p2:#ff5d7a;
    --ball:#ffe066;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif; color:var(--text);}
  #app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; touch-action:none;}
  #gameCanvas{display:block; background:#0d1220; touch-action:none;}

  .screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #1a2136 0%, #0b0e14 70%);
    padding:24px; gap:16px; text-align:center; z-index:20;
  }
  .hidden{display:none !important;}

  .logo{font-size:40px; font-weight:900; letter-spacing:2px; line-height:1.1;}
  .logo span{color:var(--accent);}
  .tagline{color:var(--sub); font-size:13px; margin-bottom:12px;}

  .nameRow{display:flex; align-items:center; gap:8px; background:var(--panel); padding:10px 14px; border-radius:14px; width:min(320px,86vw);}
  .nameRow input{flex:1; background:transparent; border:none; color:var(--text); font-size:15px; outline:none;}
  .nameRow label{font-size:12px; color:var(--sub); white-space:nowrap;}

  .menuBtn{
    width:min(320px,86vw); padding:16px; border-radius:16px; border:none; font-size:17px; font-weight:700;
    background:var(--panel2); color:var(--text); display:flex; flex-direction:column; gap:2px; cursor:pointer;
  }
  .menuBtn small{font-weight:400; color:var(--sub); font-size:12px;}
  .menuBtn.primary{background:linear-gradient(135deg,var(--accent),#3ab8a0); color:#06120f;}
  .menuBtn.primary small{color:#0a2b24;}
  .menuBtn.versus{background:linear-gradient(135deg,var(--accent2),#c23854); color:#2a0510;}
  .menuBtn.versus small{color:#3a0a16;}
  .menuBtn:active{transform:scale(0.97);}

  #rankBox{width:min(320px,86vw); background:var(--panel); border-radius:14px; padding:12px 14px; max-height:170px; overflow-y:auto;}
  #rankBox h3{margin:0 0 8px; font-size:13px; color:var(--sub); font-weight:600; letter-spacing:1px;}
  .rankRow{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #232a3b;}
  .rankRow:last-child{border-bottom:none;}
  .rankRow .rk{color:var(--accent); width:22px; font-weight:700;}
  .rankRow .nm{flex:1; text-align:left; padding-left:6px; color:var(--text);}
  .rankRow .sc{color:var(--sub);}

  /* HUD */
  #hud{position:fixed; inset:0; pointer-events:none; z-index:10;}
  #topBar,#bottomInfo{position:absolute; left:0; right:0; display:flex; justify-content:center; padding:10px; gap:10px;}
  #topBar{top:0;}
  #timerBox{background:rgba(20,25,36,.75); backdrop-filter:blur(4px); padding:8px 16px; border-radius:12px; font-size:15px; font-weight:700; letter-spacing:1px;}
  #statusMsg{position:absolute; top:46%; left:0; right:0; text-align:center; font-size:26px; font-weight:900; text-shadow:0 2px 8px #000;}

  #joyWrap{position:absolute; left:24px; bottom:24px; width:130px; height:130px; pointer-events:auto;}
  #joyBase{position:absolute; inset:0; border-radius:50%; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.15);}
  #joyStick{position:absolute; width:56px; height:56px; border-radius:50%; background:rgba(94,225,201,.85); left:37px; top:37px; box-shadow:0 2px 10px rgba(0,0,0,.4);}

  #exitBtn{position:absolute; right:16px; top:16px; pointer-events:auto; background:rgba(20,25,36,.75); border:none; color:var(--text); width:38px; height:38px; border-radius:10px; font-size:16px;}

  #resultCard{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; background:rgba(6,8,14,.82); flex-direction:column; gap:14px; padding:24px;}
  #resultCard h2{font-size:28px; margin:0;}
  #resultCard .scoreLine{font-size:16px; color:var(--sub);}
  #saveMsg{font-size:12px; color:var(--accent); min-height:16px;}

  .smallHint{font-size:11px; color:var(--sub); margin-top:-6px;}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- HUD (in-game) -->
<div id="hud" class="hidden">
  <div id="topBar"><div id="timerBox">00:00</div></div>
  <div id="statusMsg" class="hidden"></div>
  <div id="joyWrap">
    <div id="joyBase"></div>
    <div id="joyStick"></div>
  </div>
  <button id="exitBtn">✕</button>
</div>

<!-- Title / Menu -->
<div id="menuScreen" class="screen">
  <div class="logo">CORE<br><span>BREAKER</span></div>
  <div class="tagline">ボールを弾いて相手のコアを破壊せよ</div>

  <div class="nameRow">
    <label>名前</label>
    <input id="nameInput" maxlength="10" placeholder="プレイヤー名">
  </div>

  <button class="menuBtn primary" id="btnSingle">
    シングルモード（サバイバル）

  <button class="menuBtn versus" id="btnVersus">
    ランダムマッチ（オンライン対戦）

  <div id="rankBox">
    <h3>🏆 サバイバル ランキング TOP10</h3>
    <div id="rankList">読み込み中...</div>
  </div>
</div>

<!-- Matching screen -->
<div id="matchScreen" class="screen hidden">
  <div class="logo" style="font-size:26px;">対戦相手を探しています…</div>

  <button class="menuBtn" id="cancelMatchBtn">キャンセル</button>
</div>

<!-- Result -->
<div id="resultCard" class="hidden">
  <h2 id="resultTitle">GAME OVER</h2>
  <div class="scoreLine" id="resultScore"></div>
  <div id="saveMsg"></div>
  <button class="menuBtn primary" id="backToMenuBtn">メニューに戻る</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
/* =========================================================
   FIREBASE INIT
   ========================================================= */

  apiKey: "AIzaSyASxo79YBtkxBWRFWzQtIoFdWw9iegkomI",
  authDomain: "haikyo-61102.firebaseapp.com",
  projectId: "haikyo-61102",

  messagingSenderId: "193210205676",
  appId: "1:193210205676:web:6977fc30bf4b9084a82cc9",
  measurementId: "G-ES8PVYT8MH"

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const myUid = "u_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);

/* =========================================================
   GLOBAL / DOM
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menuScreen = document.getElementById('menuScreen');
const matchScreen = document.getElementById('matchScreen');
const resultCard = document.getElementById('resultCard');
const hud = document.getElementById('hud');
const timerBox = document.getElementById('timerBox');
const statusMsg = document.getElementById('statusMsg');
const nameInput = document.getElementById('nameInput');
const rankList = document.getElementById('rankList');
const matchStatus = document.getElementById('matchStatus');

nameInput.value = localStorage.getItem('cb_name') || ('プレイヤー' + Math.floor(Math.random()*1000));
nameInput.addEventListener('change', ()=> localStorage.setItem('cb_name', nameInput.value.trim() || nameInput.placeholder));

// logical game space (portrait)
const GW = 400, GH = 700;
let scale = 1, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w/GW, h/GH);
  canvas.width = w * devicePixelRatio;
  canvas.height = h * devicePixelRatio;
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  offX = (w - GW*scale)/2;
  offY = (h - GH*scale)/2;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resize);
resize();

function toGameCoords(clientX, clientY){
  return { x:(clientX - offX)/scale, y:(clientY - offY)/scale };
}

/* =========================================================
   JOYSTICK
   ========================================================= */
const joyWrap = document.getElementById('joyWrap');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
let joy = {active:false, nx:0, ny:0, id:null};

function joyCenter(){
  const r = joyBase.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, radius:r.width/2};
}
function joyStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  joy.active = true; joy.id = t.identifier ?? 'mouse';
  joyMove(e);
}
function joyMove(e){
  if(!joy.active) return;
  let t = e.changedTouches ? [...e.changedTouches].find(tt=>tt.identifier===joy.id) : e;
  if(!t) return;
  const c = joyCenter();
  let dx = t.clientX - c.x, dy = t.clientY - c.y;
  const dist = Math.min(Math.hypot(dx,dy), c.radius);
  const ang = Math.atan2(dy,dx);
  const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
  joyStick.style.left = (37+kx)+'px';
  joyStick.style.top = (37+ky)+'px';
  joy.nx = kx/c.radius; joy.ny = ky/c.radius;
  e.preventDefault && e.preventDefault();
}
function joyEnd(e){
  joy.active=false; joy.nx=0; joy.ny=0; joy.id=null;
  joyStick.style.left='37px'; joyStick.style.top='37px';
}
joyWrap.addEventListener('touchstart', joyStart, {passive:false});
joyWrap.addEventListener('touchmove', joyMove, {passive:false});
joyWrap.addEventListener('touchend', joyEnd);
joyWrap.addEventListener('touchcancel', joyEnd);
joyWrap.addEventListener('mousedown', joyStart);
window.addEventListener('mousemove', (e)=>{ if(joy.active) joyMove(e); });
window.addEventListener('mouseup', joyEnd);

/* =========================================================
   GAME OBJECTS / CONSTANTS
   ========================================================= */
const PADDLE_W = 70, PADDLE_H = 14;
const PADDLE_SPEED = 320; // px/sec at full joystick
const BALL_R = 8;
const CORE_SEGMENTS = 5;
const CORE_SEG_W = 60, CORE_SEG_H = 18, CORE_GAP = 4;
const CORE_TOTAL_W = CORE_SEGMENTS*CORE_SEG_W + (CORE_SEGMENTS-1)*CORE_GAP;

function makeCore(){
  const arr = [];
  for(let i=0;i<CORE_SEGMENTS;i++) arr.push(true);
  return arr;
}
function coreAlive(core){ return core.some(b=>b); }
function coreHpCount(core){ return core.filter(b=>b).length; }

/* Player paddle zone (own half). For single & versus: bottom player moves within lower half; core sits at very bottom.
   Top (opponent / mirrored) similarly at top. */

function newBall(x,y,vx,vy){ return {x,y,vx,vy,r:BALL_R}; }

/* =========================================================
   RENDER HELPERS
   ========================================================= */
function drawBackground(){
  ctx.fillStyle = '#0d1220';
  ctx.fillRect(0,0,GW,GH);
  // center net line
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.setLineDash([6,10]);
  ctx.beginPath(); ctx.moveTo(0,GH/2); ctx.lineTo(GW,GH/2); ctx.stroke();
  ctx.setLineDash([]);
}
function drawPaddle(x,y,color){
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 10;
  roundRect(x-PADDLE_W/2, y-PADDLE_H/2, PADDLE_W, PADDLE_H, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
}
function drawCore(centerX, y, core, color, flip){
  const startX = centerX - CORE_TOTAL_W/2;
  for(let i=0;i<core.length;i++){
    const bx = startX + i*(CORE_SEG_W+CORE_GAP);
    if(core[i]){
      ctx.fillStyle = color;
      roundRect(bx, y - CORE_SEG_H/2, CORE_SEG_W, CORE_SEG_H, 4);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.lineWidth=1.5;
      roundRect(bx, y - CORE_SEG_H/2, CORE_SEG_W, CORE_SEG_H, 4);
      ctx.stroke();
    }
  }
}
function drawBall(b){
  ctx.fillStyle = 'var(--ball)';
  ctx.fillStyle = '#ffe066';
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function paddleCoreCollision(ball, coreCenterX, coreY, core, fromBelow){
  // check collision with alive segments; fromBelow: ball moving up into core (core at top) etc — direction irrelevant, just AABB circle test
  const startX = coreCenterX - CORE_TOTAL_W/2;
  for(let i=0;i<core.length;i++){
    if(!core[i]) continue;
    const bx = startX + i*(CORE_SEG_W+CORE_GAP);
    const by = coreY - CORE_SEG_H/2;
    if(ball.x+ball.r > bx && ball.x-ball.r < bx+CORE_SEG_W && ball.y+ball.r > by && ball.y-ball.r < by+CORE_SEG_H){
      core[i] = false;
      ball.vy *= -1;
      ball.vx += (Math.random()-0.5)*60;
      return true;
    }
  }
  return false;
}

function ballHitsPaddle(ball, px, py){
  return ball.x+ball.r > px-PADDLE_W/2 && ball.x-ball.r < px+PADDLE_W/2 &&
         ball.y+ball.r > py-PADDLE_H/2 && ball.y-ball.r < py+PADDLE_H/2;
}
function bounceOffPaddle(ball, px, speedMul){
  const rel = (ball.x - px)/(PADDLE_W/2); // -1..1
  const speed = Math.hypot(ball.vx,ball.vy) * (speedMul||1.03);
  const ang = rel * (Math.PI/3); // max 60deg
  const dirY = ball.vy > 0 ? -1 : 1;
  ball.vx = Math.sin(ang)*speed;
  ball.vy = Math.cos(ang)*speed*dirY;
}

/* =========================================================
   STATE MACHINE
   ========================================================= */
let mode = null; // 'single' | 'versus'
let rafId = null;
let lastT = 0;

/* ---------- SINGLE MODE ---------- */
const single = {};
function startSingle(){
  mode='single';
  single.paddleX = GW/2; single.paddleY = GH-70;
  single.coreY = GH-24;
  single.core = makeCore();
  single.balls = [];
  single.spawnTimer = 0;
  single.spawnInterval = 1.6;
  single.elapsed = 0;
  single.over = false;
  showGameUI();
  lastT = performance.now();
  loop();
}
function spawnSingleBall(){
  const side = Math.floor(Math.random()*3); // 0 top,1 left,2 right
  let x,y,vx,vy;
  const speed = 130 + Math.random()*60 + Math.min(single.elapsed*2, 160);
  if(side===0){ x = Math.random()*GW; y = -10; }
  else if(side===1){ x = -10; y = Math.random()*GH*0.6; }
  else { x = GW+10; y = Math.random()*GH*0.6; }
  const tx = single.paddleX + (Math.random()-0.5)*120;
  const ty = single.coreY;
  const ang = Math.atan2(ty-y, tx-x);
  vx = Math.cos(ang)*speed; vy = Math.sin(ang)*speed;
  single.balls.push(newBall(x,y,vx,vy));
}
function updateSingle(dt){
  single.elapsed += dt;
  timerBox.textContent = fmtTime(single.elapsed);

  single.paddleX += joy.nx * PADDLE_SPEED * dt;
  single.paddleX = clamp(single.paddleX, PADDLE_W/2+4, GW-PADDLE_W/2-4);
  single.paddleY += joy.ny * PADDLE_SPEED*0.5 * dt;
  single.paddleY = clamp(single.paddleY, GH*0.45, GH-40);

  single.spawnTimer += dt;
  single.spawnInterval = Math.max(0.45, 1.6 - single.elapsed*0.02);
  if(single.spawnTimer > single.spawnInterval){
    single.spawnTimer = 0;
    spawnSingleBall();
  }

  for(let i=single.balls.length-1;i>=0;i--){
    const b = single.balls[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x < b.r){ b.x=b.r; b.vx*=-1; }
    if(b.x > GW-b.r){ b.x=GW-b.r; b.vx*=-1; }
    if(b.y < -40){ single.balls.splice(i,1); continue; }

    if(ballHitsPaddle(b, single.paddleX, single.paddleY) && b.vy>0){
      bounceOffPaddle(b, single.paddleX, 1.04);
      b.y = single.paddleY - PADDLE_H/2 - b.r;
    }
    if(b.y > single.coreY - CORE_SEG_H/2 - 30 && b.y < GH+30){
      if(paddleCoreCollision(b, single.paddleX, single.coreY, single.core, true)){
        // segment destroyed, ball bounced already inside function
      }
      if(b.y > GH+20){ single.balls.splice(i,1); }
    }
  }

  if(!coreAlive(single.core) && !single.over){
    endSingle();
  }
}
function drawSingle(){
  drawBackground();
  ctx.save();
  ctx.translate(0,0);
  drawCore(single.paddleX, single.coreY, single.core, '#5ee1c9');
  drawPaddle(single.paddleX, single.paddleY, '#e9edf5');
  single.balls.forEach(drawBall);
  ctx.restore();
}
function endSingle(){
  single.over = true;
  cancelAnimationFrame(rafId);
  const score = Math.floor(single.elapsed);
  showResult('GAME OVER', `生存時間: ${fmtTime(single.elapsed)}`, ()=>{
    saveScore(score);
  });
}

/* ---------- VERSUS MODE (Firebase realtime) ---------- */
const versus = {};
let roomRef=null, myRole=null, roomId=null, unsubState=null, unsubPaddle=null;

function cleanupVersus(){
  if(unsubState){ unsubState(); unsubState=null; }
  if(unsubPaddle){ unsubPaddle(); unsubPaddle=null; }
  if(roomRef){ roomRef.off(); }
  roomRef=null; roomId=null; myRole=null;
}

let matchCancelled = false;
async function startMatchmaking(){
  matchCancelled = false;
  matchScreen.classList.remove('hidden');
  matchStatus.textContent = '対戦相手を探しています…';

  const waitingRef = db.ref('lobby/waiting');
  const myName = (nameInput.value||'名無し').trim();

  const res = await waitingRef.transaction(cur=>{
    if(cur===null || (Date.now()-(cur.ts||0) > 15000)){
      return {uid:myUid, name:myName, ts:Date.now()};
    }
    return cur; // leave as is, someone already waiting
  });

  if(matchCancelled) return;

  if(res.committed && res.snapshot.val() && res.snapshot.val().uid===myUid){
    // I'm the host, wait for assignment
    myRole = 'host';
    matchStatus.textContent = '相手を待っています…';
    const assignRef = db.ref('lobby/hostAssignments/'+myUid);
    const cb = assignRef.on('value', snap=>{
      const val = snap.val();
      if(val && val.roomId){
        assignRef.off('value', cb);
        assignRef.remove();
        waitingRef.transaction(cur=> (cur && cur.uid===myUid) ? null : cur);
        enterRoom(val.roomId, 'host', val.guestName || '対戦相手');
      }
    });
    // allow cancel
    startMatchmaking._cancelHostListener = ()=> assignRef.off('value', cb);
  } else {
    // someone else waiting -> become guest
    const waitingVal = res.snapshot.val();
    if(!waitingVal || !waitingVal.uid || waitingVal.uid===myUid){
      // race condition fallback: retry
      return startMatchmaking();
    }
    myRole = 'guest';
    const newRoomRef = db.ref('rooms').push();
    roomId = newRoomRef.key;
    const initState = initialRoomState();
    await newRoomRef.set({
      hostId: waitingVal.uid, hostName: waitingVal.name||'ホスト',
      guestId: myUid, guestName: myName,
      state: initState,
      createdAt: Date.now()
    });
    await db.ref('lobby/hostAssignments/'+waitingVal.uid).set({roomId, guestName:myName});
    enterRoom(roomId, 'guest', waitingVal.name||'対戦相手');
  }
}
function cancelMatchmaking(){
  matchCancelled = true;
  if(startMatchmaking._cancelHostListener) startMatchmaking._cancelHostListener();
  db.ref('lobby/waiting').transaction(cur=> (cur && cur.uid===myUid) ? null : cur);
  matchScreen.classList.add('hidden');
}
document.getElementById('cancelMatchBtn').addEventListener('click', cancelMatchmaking);

function initialRoomState(){
  return {
    ball: {x:GW/2, y:GH/2, vx: (Math.random()<0.5?-1:1)*140, vy:(Math.random()<0.5?-1:1)*160},
    hostPaddleX: GW/2, hostPaddleY: GH-70,
    guestPaddleX: GW/2, guestPaddleY: GH-70,
    hostCore: makeCore(), guestCore: makeCore(),
    status:'playing', winner:null, updatedAt: Date.now()
  };
}

function enterRoom(rid, role, opponentName){
  roomId = rid; myRole = role;
  matchScreen.classList.add('hidden');
  roomRef = db.ref('rooms/'+roomId);
  if(role==='host'){
    roomRef.onDisconnect().update({status:'opponent_left'});
  } else {
    roomRef.child('guestId').onDisconnect().set(null);
    roomRef.onDisconnect().update({status:'opponent_left'});
  }
  versus.opponentName = opponentName;
  versus.myPaddleX = GW/2; versus.myPaddleY = GH-70;
  versus.localState = null;
  versus.over = false;
  versus.startedAt = Date.now();

  // listen to full state (used for rendering by both; host is authoritative writer)
  roomRef.child('state').on('value', snap=>{
    versus.remoteState = snap.val();
    if(versus.remoteState && versus.remoteState.status && versus.remoteState.status!=='playing' && !versus.over){
      finishVersus(versus.remoteState.status, versus.remoteState.winner);
    }
  });

  mode='versus';
  showGameUI();
  lastT = performance.now();
  versus.lastPush = 0;
  loop();
}

function updateVersusLocal(dt){
  // move my own paddle locally always (both host & guest control paddle client-side)
  versus.myPaddleX += joy.nx * PADDLE_SPEED * dt;
  versus.myPaddleX = clamp(versus.myPaddleX, PADDLE_W/2+4, GW-PADDLE_W/2-4);
  versus.myPaddleY += joy.ny * PADDLE_SPEED*0.5 * dt;
  if(myRole==='host'){
    versus.myPaddleY = clamp(versus.myPaddleY, GH*0.55, GH-40);
  } else {
    versus.myPaddleY = clamp(versus.myPaddleY, 40, GH*0.45);
  }

  versus.lastPush += dt;
  if(versus.lastPush > 0.07 && roomRef){
    versus.lastPush = 0;
    const field = myRole==='host' ? {hostPaddleX:versus.myPaddleX, hostPaddleY:versus.myPaddleY}
                                   : {guestPaddleX:versus.myPaddleX, guestPaddleY:versus.myPaddleY};
    roomRef.child('state').update(field);
  }

  if(myRole==='host'){
    hostSimulate(dt);
  }
}

function hostSimulate(dt){
  const st = versus.remoteState;
  if(!st || st.status!=='playing') return;
  let ball = st.ball || initialRoomState().ball;
  const hostCore = st.hostCore || makeCore();
  const guestCore = st.guestCore || makeCore();
  const hostPX = versus.myPaddleX, hostPY = versus.myPaddleY;
  const guestPX = st.guestPaddleX ?? GW/2, guestPY = st.guestPaddleY ?? 70;

  ball.x += ball.vx*dt; ball.y += ball.vy*dt;
  if(ball.x < BALL_R){ ball.x=BALL_R; ball.vx*=-1; }
  if(ball.x > GW-BALL_R){ ball.x=GW-BALL_R; ball.vx*=-1; }

  const ballObj = {x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,r:BALL_R};

  if(ballHitsPaddle(ballObj, hostPX, hostPY) && ballObj.vy>0){
    bounceOffPaddle(ballObj, hostPX, 1.03);
    ballObj.y = hostPY - PADDLE_H/2 - ballObj.r;
  } else if(ballHitsPaddle(ballObj, guestPX, guestPY) && ballObj.vy<0){
    bounceOffPaddle(ballObj, guestPX, 1.03);
    ballObj.y = guestPY + PADDLE_H/2 + ballObj.r;
  }

  let winner = null, status='playing';
  if(ballObj.y > GH - 40){
    paddleCoreCollision(ballObj, hostPX, GH-24, hostCore, true);
    if(!coreAlive(hostCore)){ status='finished'; winner='guest'; }
  }
  if(ballObj.y < 40){
    paddleCoreCollision(ballObj, guestPX, 24, guestCore, true);
    if(!coreAlive(guestCore)){ status='finished'; winner='host'; }
  }
  // clamp ball vertical just in case
  ballObj.y = clamp(ballObj.y, -10, GH+10);
  if(ballObj.y < -5 || ballObj.y > GH+5){
    ball.x=GW/2; ball.y=GH/2; ball.vx=(Math.random()<0.5?-1:1)*140; ball.vy=(Math.random()<0.5?-1:1)*160;
  } else {
    ball = {x:ballObj.x,y:ballObj.y,vx:ballObj.vx,vy:ballObj.vy};
  }

  roomRef.child('state').update({
    ball, hostCore, guestCore, status, winner, hostPaddleX:hostPX, hostPaddleY:hostPY, updatedAt: Date.now()
  });
  // keep local mirror fresh so drawVersus is smooth even before listener echoes back
  versus.remoteState = {...st, ball, hostCore, guestCore, status, winner, hostPaddleX:hostPX, hostPaddleY:hostPY};
}

function drawVersus(){
  drawBackground();
  const st = versus.remoteState;
  if(!st){ return; }
  const hostCore = st.hostCore || makeCore();
  const guestCore = st.guestCore || makeCore();
  const hostPX = myRole==='host' ? versus.myPaddleX : (st.hostPaddleX ?? GW/2);
  const hostPY = myRole==='host' ? versus.myPaddleY : (st.hostPaddleY ?? GH-70);
  const guestPX = myRole==='guest' ? versus.myPaddleX : (st.guestPaddleX ?? GW/2);
  const guestPY = myRole==='guest' ? versus.myPaddleY : (st.guestPaddleY ?? 70);

  // orient so "my" side is always at bottom visually
  ctx.save();
  if(myRole==='guest'){
    ctx.translate(GW,GH); ctx.rotate(Math.PI);
  }
  drawCore(GW/2, GH-24, hostCore, myRole==='host' ? '#5ee1c9' : '#ff5d7a');
  drawCore(GW/2, 24, guestCore, myRole==='guest' ? '#5ee1c9' : '#ff5d7a');
  drawPaddle(hostPX, hostPY, myRole==='host' ? '#e9edf5' : '#c9d0dd');
  drawPaddle(guestPX, guestPY, myRole==='guest' ? '#e9edf5' : '#c9d0dd');
  if(st.ball) drawBall({x:st.ball.x,y:st.ball.y,r:BALL_R});
  ctx.restore();

  // labels
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '11px sans-serif'; ctx.textAlign='center';
  const oppLabel = versus.opponentName || '相手';
  ctx.fillText(myRole==='host' ? oppLabel : 'あなた', GW/2, GH-4);
  ctx.fillText(myRole==='guest' ? oppLabel : 'あなた', GW/2, 14);

  timerBox.textContent = fmtTime((Date.now()-versus.startedAt)/1000);
}

function finishVersus(status, winner){
  if(versus.over) return;
  versus.over = true;
  cancelAnimationFrame(rafId);
  let title, msg;
  if(status==='opponent_left'){
    title = '対戦相手が退出しました'; msg='勝利扱いになりません';
  } else {
    const iWon = winner===myRole;
    title = iWon ? 'YOU WIN!' : 'YOU LOSE...';
    msg = iWon ? '相手のコアを破壊した！' : 'コアを破壊された…';
  }
  showResult(title, msg, null);
  cleanupVersus();
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop(){
  const now = performance.now();
  let dt = (now-lastT)/1000;
  dt = Math.min(dt, 0.05);
  lastT = now;

  if(mode==='single' && !single.over){
    updateSingle(dt);
    drawSingle();
    rafId = requestAnimationFrame(loop);
  } else if(mode==='versus' && !versus.over){
    updateVersusLocal(dt);
    drawVersus();
    rafId = requestAnimationFrame(loop);
  }
}

/* =========================================================
   UI HELPERS
   ========================================================= */
function showGameUI(){
  menuScreen.classList.add('hidden');
  matchScreen.classList.add('hidden');
  resultCard.classList.add('hidden');
  hud.classList.remove('hidden');
}
function showMenu(){
  cancelAnimationFrame(rafId);
  mode=null;
  hud.classList.add('hidden');
  resultCard.classList.add('hidden');
  matchScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  loadRanking();
}
function showResult(title, scoreText, onShown){
  hud.classList.add('hidden');
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = scoreText;
  document.getElementById('saveMsg').textContent='';
  resultCard.classList.remove('hidden');
  if(onShown) onShown();
}
document.getElementById('backToMenuBtn').addEventListener('click', ()=>{
  cleanupVersus();
  showMenu();
});
document.getElementById('exitBtn').addEventListener('click', ()=>{
  if(mode==='versus' && roomRef){
    roomRef.update({status:'opponent_left'});
    cleanupVersus();
  }
  cancelAnimationFrame(rafId);
  showMenu();
});

function fmtTime(sec){
  sec = Math.max(0,sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* =========================================================
   RANKING
   ========================================================= */
function loadRanking(){
  rankList.textContent = '読み込み中...';
  db.ref('ranking').orderByChild('score').limitToLast(10).once('value').then(snap=>{
    const rows = [];
    snap.forEach(c=> rows.push(c.val()));
    rows.reverse();
    if(rows.length===0){ rankList.innerHTML = '<div style="color:var(--sub);font-size:12px;">まだ記録がありません</div>'; return; }
    rankList.innerHTML = rows.map((r,i)=>`
      <div class="rankRow"><span class="rk">${i+1}</span><span class="nm">${escapeHtml(r.name||'---')}</span><span class="sc">${fmtTime(r.score)}</span></div>
    `).join('');
  }).catch(()=>{ rankList.innerHTML = '<div style="color:var(--sub);font-size:12px;">読み込みに失敗しました</div>'; });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function saveScore(score){
  const name = (nameInput.value||'名無し').trim().slice(0,10);
  db.ref('ranking').push({name, score, ts:Date.now()}).then(()=>{
    document.getElementById('saveMsg').textContent = 'ランキングに記録しました！';
  }).catch(()=>{
    document.getElementById('saveMsg').textContent = '記録の送信に失敗しました';
  });
}

/* =========================================================
   MENU EVENTS
   ========================================================= */
document.getElementById('btnSingle').addEventListener('click', ()=>{
  localStorage.setItem('cb_name', nameInput.value.trim()||nameInput.placeholder);
  startSingle();
});
document.getElementById('btnVersus').addEventListener('click', ()=>{
  localStorage.setItem('cb_name', nameInput.value.trim()||nameInput.placeholder);
  startMatchmaking();
});

loadRanking();
</script>
